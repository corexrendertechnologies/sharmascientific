    <path d="M 30,62 C 45,35 175,35 190,62 C 170,42 50,42 30,62 Z" fill="#ffffff" opacity="0.2"/>
    <text x="110" y="86" font-family="'Georgia', 'Times New Roman', serif" font-size="50" font-weight="900" font-style="italic" letter-spacing="3" fill="#ffffff" text-anchor="middle" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.6))">SSI</text>
  </g>
  <!-- Typography on Right -->
  <text x="200" y="56" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Sharma</text>
  <text x="200" y="84" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#90e0ef" letter-spacing="0.5">Scientific Instruments</text>
  <text x="200" y="104" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" letter-spacing="1.5">AHMEDABAD • ESTD. 1999</text>
